# Packages: brew/brew-cask/flatpak app+formula names, installed via
# `mise bootstrap packages apply`. Scoped by OS first (the backend itself is
# OS-specific), then by role — work is NOT assumed to always be darwin; personal is assumed being Linux.
[mise.packages.darwin.common]
  # Not a role concern: Linux gets these via rpm-ostree host layering instead.
  brews = [
    "zsh-autosuggestions",
    "zsh-syntax-highlighting",
  ]
  casks = []

[mise.packages.darwin.work]
  brews = [
    "googleworkspace-cli",
    "hermes-agent",
    "dashlane/tap/dashlane-cli",
  ]
  casks = [
    "aerospace",
    "antigravity",
    "bitwarden",
    "claude-code",
    "firefox",
    "gcloud-cli",
    "ghostty",
    "google-chrome",
    "hermes-desktop",
    "obsidian",
    "podman-desktop",
    "raycast",
    "shortcat",
    "slack",
    "spotify",
    "visual-studio-code",
    "yubico-authenticator",
    "zed",
    "font-jetbrains-mono-nerd-font",
  ]

[mise.packages.linux.common]
  # Empty today (as work is macOS, there is no common Linux packages between roles); 
  # populate if work moves to Linux — no template or structural changes needed, just data here.
  flatpaks = []

